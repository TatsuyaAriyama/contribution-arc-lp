      </g>
    </g>
  </g>

  <!-- Heatmap drawn explicitly with deterministic intensities -->
  <g transform="translate(304 260)">
    <!-- 52 columns -->
    <!-- Use script-free deterministic placement: we render a coarse pattern -->
    <g>
      <!-- We'll create columns manually with varying greens -->
    </g>
  </g>

  <!-- Heatmap implementation: 52 cols, 7 rows -->
  <g transform="translate(304 260)" font-family="monospace">
    <!-- Generate via simple loops would be ideal, but SVG is static; we draw a representative dense grid -->
    <g>
      <!-- column groups -->
      <!-- Row spacing 22, col spacing 22 -->
      <!-- shades: light=#ecf2eb, mid1=#c8dcc6, mid2=#8db090, dark=#5a8061, darker=#3a5a40 -->
      <g id="cells">
        <!-- Programmatically writing every cell is verbose; we draw bands with varying densities for placeholder feel -->
        <rect x="0" y="0" width="1144" height="146" rx="4" fill="#ecf2eb"/>
      </g>

      <!-- scattered darker cells to suggest contributions -->
      <g fill="#8db090">
        <rect x="44" y="0" width="18" height="18" rx="3"/>
        <rect x="66" y="22" width="18" height="18" rx="3"/>
        <rect x="110" y="0" width="18" height="18" rx="3"/>
