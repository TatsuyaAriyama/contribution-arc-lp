      <g id="hm"></g>
    </g>
  </g>

  <!-- Pre-drawn heatmap cells -->
  <g transform="translate(304 260)">
    <!-- 52 columns x 7 rows -->
    <!-- Each cell 18x18, gap 4 -->
    <g fill="#ecf2eb">
      <!-- background grid -->
      <g id="bg-grid">
